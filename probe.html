<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tumble Rush: connection check</title>
    <style>
      body { margin: 0; padding: 24px; font-family: system-ui, sans-serif; font-size: 18px; background: #1b1b2f; color: #fff; }
      main { max-width: 700px; margin: 0 auto; }
      h1 { margin: 0 0 4px; color: #ffd23f; }
      .sub { margin-top: 0; color: #e3e3f2; line-height: 1.5; }
      #banner { padding: 24px; border-radius: 12px; font-size: 28px; font-weight: 700; text-align: center; background: #444466; }
      #banner[data-status="running"] { background: #3b6fd4; }
      #banner[data-status="green"] { background: #1f9d55; }
      #banner[data-status="red"] { background: #d64545; }
      .room { margin: 16px 0 4px; }
      .code { display: inline-block; margin: 0 12px 0 4px; font-size: 44px; letter-spacing: 0.15em; color: #ffd23f; }
      .same { color: #c9c9e0; }
      .join { margin: 8px 0 16px; line-height: 1.6; }
      .hint { padding: 12px; border-radius: 8px; background: #6b4f12; font-weight: 700; }
      a { color: #4ecdc4; word-break: break-all; }
      table { width: 100%; border-collapse: collapse; margin: 16px 0; }
      td { padding: 8px 4px; border-bottom: 1px solid #3a3a5c; }
      td:last-child { text-align: right; font-weight: 700; }
      #result { padding: 12px; background: #2d2a55; border-radius: 8px; min-height: 1.4em; font-size: 20px; font-weight: 700; overflow-wrap: anywhere; }
      .after { color: #e3e3f2; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/probe.js"></script>
  </body>
</html>
